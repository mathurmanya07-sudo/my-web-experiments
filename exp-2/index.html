<!DOCTYPE html>
<html>
<head>
    <title>Manya's Portfolio</title>
    <style>
        /* CSS starts here */
        body { font-family: Arial; background-color: rgb(254, 198, 209); margin: 0; }
        
        /* Header stretches full width */
        header { background-color: rgb(214, 107, 138); color: white; padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
        
        /* This centers the sections in the middle */
        .container {
            width: 60%;        /* Takes up 60% of the screen */ 
            margin: 20px auto; /* 'auto' centers it horizontally */
        }
        
        section { 
            background: rgb(246, 230, 230); 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; /* Space between sections */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .project { border: 1px solid #d66b8a; padding: 10px; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <header>
        <h1>Manya's Portfolio</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- The container div holds all sections to keep them centered -->
    <div class="container">
        
        <!-- About Section -->
        <section id="about">
            <h2>About Me</h2>
            <p>Hi, I am Manya, a 2nd-year B.Tech student.</p>
        </section>

        <!-- Projects Section -->
        <section id="projects">
            <h2>Projects</h2>
            <div class="project">Weather App</div>
            <div class="project">To-Do List</div>
        </section>

        <!-- Contact Form Section -->
        <section id="contact">
            <h2>Contact Me</h2>
            <form>
                <input type="text" placeholder="Name" required><br><br>
                <input type="email" placeholder="Email" required><br><br>
                <button type="submit">Send</button>
            </form>
        </section>

    </div>

</body>
</html>
