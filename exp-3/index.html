<!DOCTYPE html>
<html>
<head>
    <title>Manya's To-Do List</title>
    <style>
        body { font-family: Arial; background-color: rgb(107, 72, 251); padding: 30px; text-align: center;}
        .box { background: rgb(250, 251, 253); padding: 20px; width: 500px; margin: auto; border-radius: 10px; }
        li { display: flex; justify-content: space-between; background: #eee; padding: 10px; margin-top: 10px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="box">
        <h1>My To-Do List</h1>
        <input type="text" id="taskInput" placeholder="New task">
        <button onclick="addTask()">Add</button>
        <ul id="taskList" style="list-style-type: none; padding: 0;"></ul>
    </div>

    <script>
        function addTask() {
            var input = document.getElementById("taskInput");
            var task = input.value;
            if (task === "") return; 

            var li = document.createElement("li");
            li.innerHTML = task + " <button onclick='this.parentElement.remove()'>X</button>";
            
            li.onclick = function() {
                li.style.textDecoration = "line-through";
            };

            document.getElementById("taskList").appendChild(li);
            input.value = ""; 
        }
    </script>
</body>
</html>
