<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manya's To-Do List</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f3f0ff; /* Soft purple background */
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.1); /* Soft purple shadow */
            width: 100%;
            max-width: 500px;
        }
        h1 { color: #6c5ce7; text-align: center; } /* Main purple text */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { 
            flex-grow: 1; 
            padding: 12px; 
            border: 1px solid #a29bfe; /* Light purple border */
            border-radius: 8px; 
            outline: none;
            color: #2d3436;
        }
        input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 5px rgba(108, 92, 231, 0.3);
        }
        button.add-btn { 
            padding: 12px 20px; 
            background-color: #6c5ce7; /* Button purple */
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        button.add-btn:hover { background-color: #5b4bc4; } /* Darker purple on hover */
        ul { list-style-type: none; padding: 0; }
        li { 
            background: #f8f7ff; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 5px solid #6c5ce7; /* Purple accent line on the left */
        }
        .task-text { cursor: pointer; flex-grow: 1; color: #2d3436; }
        .delete-btn {
            background-color: #ff7675; /* Soft red for delete */
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.9rem;
        }
        .delete-btn:hover {
            background-color: #e84342;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value;

            // Don't add empty tasks
            if (taskText === '') {
                alert("Please enter a task!");
                return;
            }

            // Create the list item
            const li = document.createElement('li');
            
            // Create the text span
            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = taskText;
            
            // Mark Complete logic
            span.onclick = function() {
                if (span.style.textDecoration === "line-through") {
                    span.style.textDecoration = "none";
                    span.style.color = "#2d3436"; // Back to normal black/grey
                } else {
                    span.style.textDecoration = "line-through";
                    span.style.color = "#a29bfe"; // Light purple when crossed out
                }
            };

            // Delete Button logic
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = function(e) {
                e.stopPropagation(); // Prevent marking complete when deleting
                li.remove();
            };

            // Put it all together
            li.appendChild(span);
            li.appendChild(deleteBtn);
            document.getElementById('taskList').appendChild(li);
            
            // Clear the input box
            input.value = ''; 
        }
    </script>
</body>
</html>
