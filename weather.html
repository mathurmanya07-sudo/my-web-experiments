<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manya's Weather App</title>
    <style>
        /* Navy, Purple, and Electric Blue Theme */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #0a192f; /* Deep Navy Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e6f1ff;
        }
        
        .weather-card {
            background: #112240; /* Lighter Navy for the card */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.1); /* Glowing effect */
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(139, 92, 246, 0.2); /* Subtle purple border */
        }
        
        h1 { 
            color: #8b5cf6; /* Purple */
            margin-top: 0; 
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        
        .input-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        
        input { 
            flex-grow: 1; 
            padding: 12px; 
            background-color: #0a192f; /* Navy inside input */
            border: 1px solid #233554; 
            border-radius: 8px; 
            outline: none;
            font-size: 1rem;
            color: white;
        }
        
        input:focus { 
            border-color: #8b5cf6; /* Purple border on focus */
            box-shadow: 0 0 5px rgba(139, 92, 246, 0.5);
        }
        
        button { 
            padding: 12px 20px; 
            background-color: #8b5cf6; /* Purple Button */
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        
        button:hover { 
            background-color: #7c3aed; /* Slightly darker purple */
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); /* Purple glow on hover */
        }
        
        #result { margin-top: 20px; }
        
        .error { 
            color: #ff7675; 
            font-weight: bold; 
        }
        
        .weather-info h2 { 
            color: #e6f1ff; /* White/Light Blue text */
            margin-bottom: 5px; 
            font-size: 2rem;
        }
        
        .weather-info p { 
            color: #8892b0; /* Muted grey-blue for details */
            font-size: 1.2rem; 
            margin: 5px 0;
        }
        
        .temp { 
            font-size: 3.5rem; 
            color: #00d4ff; /* Electric Blue for Temperature! */
            font-weight: bold; 
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4); /* Electric glow */
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <h1>Weather Checker</h1>
        
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const apiKey = '05c52f6341d03c8454cd717da2ec6003'; 
            const resultDiv = document.getElementById('result');

            if (city === '') {
                resultDiv.innerHTML = '<p class="error">Please enter a city name.</p>';
                return;
            }

            resultDiv.innerHTML = '<p style="color: #8b5cf6;">Loading...</p>';

            try {
                // Fetch API
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
                
                if (!response.ok) {
                    throw new Error('City not found. Please try again.');
                }

                const data = await response.json();

                // Update the HTML with the fetched data
                resultDiv.innerHTML = `
                    <div class="weather-info">
                        <h2>${data.name}, ${data.sys.country}</h2>
                        <p class="temp">${Math.round(data.main.temp)}°C</p>
                        <p>Condition: ${data.weather[0].main}</p>
                        <p>Humidity: ${data.main.humidity}%</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
